name: release
# On a version tag (vX.Y.Z): a GitHub release with the wheel and source, and PyPI (trusted publishing: no stored
# password) once the repository variable PYPI_READY is "true". Runs only once the repository is public.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  tests:
    if: ${{ !github.event.repository.private }}
    uses: ./.github/workflows/tests.yml
  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the tag matches the package version
        run: |
          v=$(python -c "import re;print(re.search(r'VERSION = \"(.+)\"', open('witnessory/__init__.py').read()).group(1))")
          test "v$v" = "${GITHUB_REF_NAME}"
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "pip install the wheel below, or see https://witnessory.org/llms.txt"
  pypi:
    needs: build
    if: ${{ vars.PYPI_READY == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
