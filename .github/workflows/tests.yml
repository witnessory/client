name: tests
on:
  push:
    branches: ["**"]          # tags run these through release.yml
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . "cryptography>=48"
      - shell: bash
        run: |
          rm -rf witnessory               # test the installed package, not the source tree
          python -m unittest discover -s tests -v
      - run: witnessory --version
